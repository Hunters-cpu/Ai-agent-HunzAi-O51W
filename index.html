function formatTimeAgo(ts) {
  if (!ts) return '-';
  const date = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = Date.now() - date.getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60) return 'Baru saja';
  const m = Math.floor(s / 60);
  if (m < 60) return `${m} menit lalu`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} jam lalu`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d} hari lalu`;
  return date.toLocaleDateString('id-ID');
}

const PENDING_REGISTRATIONS = new Map();
const CODE_EXPIRY_MS = 10 * 60 * 1000;
const RESEND_COOLDOWN_MS = 60 * 1000;
const MAX_VERIFY_ATTEMPTS = 5;

function generateVerificationCode() {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return String(100000 + (arr[0] % 900000));
}
async function hashVerificationCode(email, code) {
  const data = new TextEncoder().encode(`${email.toLowerCase()}:${code}:hunzai_verify_2025_v1`);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash), b => b.toString(16).padStart(2, '0')).join('');
}
async function sendVerificationEmail(email, code, name) {
  if (typeof emailjs === 'undefined') throw new Error('EmailJS belum dimuat. Cek koneksi internet.');
  if (!EMAILJS_CONFIG.publicKey || EMAILJS_CONFIG.publicKey.startsWith('GANTI')) {
    throw new Error('EmailJS belum dikonfigurasi. Hubungi admin.');
  }
  const templateParams = {
    to_email: email,
    to_name: name || email.split('@')[0],
    verification_code: code,
    brand_name: SITE?.branding?.brandName || 'HunzAi-O51W',
    from_name: EMAILJS_CONFIG.fromName,
    reply_to: EMAILJS_CONFIG.fromEmail,
    expiry_minutes: 10
  };
  return await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, templateParams, EMAILJS_CONFIG.publicKey);
}
async function startRegistration(email, password, name) {
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Format email tidak valid');
  if (password.length < 6) throw new Error('Password minimal 6 karakter');
  if (!name || name.length < 2) throw new Error('Nama minimal 2 karakter');

  // Cek apakah email sudah terdaftar di Firebase Auth (fetch sign-in methods)
  try {
    const existingUser = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=${firebaseConfig.apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: email, continueUri: 'http://localhost' })
    }).then(r => r.json());
    if (existingUser.registered) throw new Error('Email sudah terdaftar. Silakan login.');
  } catch (e) {
    if (e.message.includes('sudah terdaftar')) throw e;
    // Abaikan error lain (misal network), tetap lanjut
  }

  const code = generateVerificationCode();
  const codeHash = await hashVerificationCode(email, code);

  PENDING_REGISTRATIONS.set(email, {
    codeHash, data: { name, password },
    expiresAt: Date.now() + CODE_EXPIRY_MS,
    attempts: 0, sentAt: Date.now()
  });

  try {
    await sendVerificationEmail(email, code, name);
    State.regEmail = email;
    return { success: true };
  } catch (err) {
    PENDING_REGISTRATIONS.delete(email);
    throw err;
  }
}
async function verifyAndComplete(code) {
  const email = State.regEmail;
  if (!email) throw new Error('Sesi verifikasi tidak ditemukan');
  const rec = PENDING_REGISTRATIONS.get(email);
  if (!rec) throw new Error('Sesi verifikasi tidak ditemukan. Silakan daftar ulang.');
  if (Date.now() > rec.expiresAt) {
    PENDING_REGISTRATIONS.delete(email);
    throw new Error('Kode sudah kedaluwarsa. Silakan kirim ulang.');
  }
  if (rec.attempts >= MAX_VERIFY_ATTEMPTS) {
    PENDING_REGISTRATIONS.delete(email);
    throw new Error('Terlalu banyak percobaan. Silakan daftar ulang.');
  }
  const inputHash = await hashVerificationCode(email, code);
  if (inputHash !== rec.codeHash) {
    rec.attempts++;
    const remaining = MAX_VERIFY_ATTEMPTS - rec.attempts;
    throw new Error(`Kode salah. Sisa ${remaining} percobaan.`);
  }
  try {
    const user = await fbRegister(email, rec.data.password, rec.data.name);
    PENDING_REGISTRATIONS.delete(email);
    State.regEmail = null;
    return user;
  } catch (err) {
    PENDING_REGISTRATIONS.delete(email);
    State.regEmail = null;
    throw err;
  }
}
async function resendVerificationCode() {
  const email = State.regEmail;
  if (!email) throw new Error('Sesi verifikasi tidak ditemukan');
  const rec = PENDING_REGISTRATIONS.get(email);
  if (!rec) throw new Error('Sesi verifikasi tidak ditemukan');
  const elapsed = Date.now() - rec.sentAt;
  if (elapsed < RESEND_COOLDOWN_MS) {
    const wait = Math.ceil((RESEND_COOLDOWN_MS - elapsed) / 1000);
    throw new Error(`Tunggu ${wait} detik sebelum kirim ulang`);
  }
  const code = generateVerificationCode();
  rec.codeHash = await hashVerificationCode(email, code);
  rec.expiresAt = Date.now() + CODE_EXPIRY_MS;
  rec.attempts = 0;
  rec.sentAt = Date.now();
  await sendVerificationEmail(email, code, rec.data.name);
  return { success: true };
}

function startVerifyCountdown() {
  clearInterval(verifyCountdownInterval);
  const el = document.getElementById('countdown');
  if (!el) return;
  const update = () => {
    const rec = PENDING_REGISTRATIONS.get(State.regEmail);
    if (!rec) { clearInterval(verifyCountdownInterval); return; }
    const remaining = Math.max(0, rec.expiresAt - Date.now());
    if (remaining === 0) {
      clearInterval(verifyCountdownInterval);
      el.textContent = '00:00';
      el.style.color = 'var(--danger)';
      return;
    }
    const m = Math.floor(remaining / 60000);
    const s = Math.floor((remaining % 60000) / 1000);
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  };
  update();
  verifyCountdownInterval = setInterval(update, 1000);
}

    input.classList.add('shake');

      SITE = JSON.parse(JSON.stringify(DEFAULT_CONTENT));

}

  const bot = { name:data.name, ownerPhone:data.ownerPhone, botPhone:data.botPhone, type:data.type||'Full Features', method:data.method||'pairing', status:'pending', apiKey:generateApiKey(), messagesSent:0, messagesReceived:0, createdAt:serverTimestamp(), connectedAt:null };
  const ref = await addDoc(collection(db,'users',uid,'bots'), bot);
  await fbLogActivity(uid, 'Bot dibuat', `Bot "${bot.name}"`, '🤖');
  return { id: ref.id, ...bot };
}
async function fbDeleteBot(uid, botId) {
  await deleteDoc(doc(db,'users',uid,'bots',botId));
  await fbLogActivity(uid, 'Bot dihapus', 'Bot dihapus dari sistem', '🗑️');
}
async function fbGetActivities(uid, max=20) {
  const q = query(collection(db,'users',uid,'activities'), orderBy('timestamp','desc'), limit(max));
  const s = await getDocs(q);
  return s.docs.map(d=>({id:d.id,...d.data()}));
}
async function fbGetSettings(uid) {
  const [m,c,w] = await Promise.all([ getDoc(doc(db,'users',uid,'settings','main')), getDoc(doc(db,'users',uid,'settings','chatbot')), getDoc(doc(db,'users',uid,'settings','webhook')) ]);
  return { main:m.exists()?m.data():{}, chatbot:c.exists()?c.data():{}, webhook:w.exists()?w.data():{} };
}
async function fbSaveSettings(uid, section, data) { await setDoc(doc(db,'users',uid,'settings',section), data, {merge:true}); }

/* ============ AUTH ============ */
function mapFirebaseError(code) {
  return {
    'auth/email-already-in-use': 'Email sudah terdaftar',
    'auth/invalid-email': 'Format email tidak valid',
    'auth/weak-password': 'Password minimal 6 karakter',
    'auth/user-not-found': 'Email tidak terdaftar',
    'auth/wrong-password': 'Password salah',
    'auth/invalid-credential': 'Email atau password salah',
    'auth/too-many-requests': 'Terlalu banyak percobaan',
    'auth/popup-closed-by-user': 'Login Google dibatalkan',
    'auth/network-request-failed': 'Koneksi internet bermasalah',
    'auth/operation-not-allowed': 'Metode login belum diaktifkan di Firebase Console'
  }[code] || null;
}

async function fbRegister(email, password, name) {
  const cred = await createUserWithEmailAndPassword(auth, email, password);
  await updateProfile(cred.user, { displayName: name });
  const isAdminEmail = email.toLowerCase() === ADMIN_EMAIL;
  await fbCreateUserDoc(cred.user.uid, {
    email: email.toLowerCase(), name,
    handle: '@' + email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g,''),
    avatar: name.charAt(0).toUpperCase(), provider: '🔑 Email',
    role: isAdminEmail ? 'Administrator' : 'User',
    badge: isAdminEmail ? '👑 ADMIN' : '💎 FREE',
    plan: isAdminEmail ? 'Infinity' : 'Free', verified: true
  });
  await fbLogActivity(cred.user.uid, 'Akun dibuat', 'Pendaftaran akun baru via email verification', '🆕');
  return cred.user;
}
async function fbLogin(email, password) {
  const cred = await signInWithEmailAndPassword(auth, email, password);
  await fbUpdateUser(cred.user.uid, { lastLogin: serverTimestamp(), isOnline: true });
  await fbLogActivity(cred.user.uid, 'Login berhasil', 'Login email & password', '🔓');
  return cred.user;
}
async function fbLoginOrCreateAdmin(email, password) {
  try { return await signInWithEmailAndPassword(auth, email, password); }
  catch(err) {
    if ((err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential')
        && email.toLowerCase() === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
      return await fbRegister(email, password, 'Administrator');
    }
    throw err;
  }
}
async function fbLoginGoogle() {
  const result = await signInWithPopup(auth, googleProvider);
  const user = result.user;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists()) {
    const isAdminEmail = user.email.toLowerCase() === ADMIN_EMAIL;
    await fbCreateUserDoc(user.uid, {
      email: user.email.toLowerCase(),
      name: user.displayName || user.email.split('@')[0],
      handle: '@' + user.email.split('@')[0].toLowerCase(),
      avatar: (user.displayName || user.email[0]).charAt(0).toUpperCase(),
      avatarImage: user.photoURL || null,
      avatarColor: 'linear-gradient(135deg,#4285F4,#2563eb)',
      provider: 'G Akun Google',
      role: isAdminEmail ? 'Administrator' : 'User',
      badge: isAdminEmail ? '👑 ADMIN' : '💎 FREE',
      plan: isAdminEmail ? 'Infinity' : 'Free',
      googleLinked: true, verified: true
    });
  } else {
    await fbUpdateUser(user.uid, { lastLogin: serverTimestamp(), isOnline: true, googleLinked: true });
  }
  await fbLogActivity(user.uid, 'Login dengan Google', 'Login passwordless', '🔓');
  return user;
}
async function fbLogout() {
  if (auth.currentUser) {
    try { await fbUpdateUser(auth.currentUser.uid, { isOnline: false }); await fbLogActivity(auth.currentUser.uid, 'Logout', 'Logout dari sistem', '🚪'); } catch(e) {}
  }
  await signOut(auth);
}

/* ============ NAV ============ */
function navigate(page) {
  if (State.currentPage !== page) State.history.push(State.currentPage);
  State.currentPage = page;
  window.location.hash = page;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  closeSheet();
}
function goBack() {
  if (State.history.length > 0) {
    const prev = State.history.pop();
    State.currentPage = prev; window.location.hash = prev; render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else navigate('home');
}
function scrollToSection(id) {
  if (State.currentPage !== 'home') { navigate('home'); setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 300); }
  else { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
}
function sheetNav(target) {
  closeSheet();
  setTimeout(() => {
    if (['pricing','features','faq','stats'].includes(target)) scrollToSection(target);
    else navigate(target);
  }, 200);
}
function handleNavAuth() { navigate(State.user ? 'dashboard' : 'login'); }

function updateAuthUI() {
  const navBtn = document.getElementById('navAuthBtn');
  const navBtnM = document.getElementById('navAuthBtnMobile');
  const avatar = document.getElementById('navAvatar');
  const sheetLogout = document.getElementById('sheetLogoutBtn');
  const sheetGrid = document.getElementById('sheetGrid');
  if (State.user) {
    if (navBtn) navBtn.style.display = 'none';
    if (navBtnM) navBtnM.style.display = 'none';
    if (avatar) {
      avatar.style.display = 'flex';
      if (State.user.avatarImage) avatar.innerHTML = `<img src="${State.user.avatarImage}" alt="avatar"/><span class="online-dot"></span>`;
      else avatar.innerHTML = `${State.user.avatar || '?'}<span class="online-dot"></span>`;
    }
    if (sheetLogout) sheetLogout.style.display = 'flex';
    if (isAdmin() && sheetGrid && !document.getElementById('sheetAdminBtn')) {
      const btn = document.createElement('button');
      btn.id = 'sheetAdminBtn';
      btn.className = 'sheet-item';
      btn.innerHTML = '<span class="ico">⚙️</span><span>Admin</span>';
      btn.onclick = () => sheetNav('admin');
      btn.style.background = 'linear-gradient(135deg,rgba(197,255,65,.2),transparent)';
      sheetGrid.insertBefore(btn, sheetGrid.firstChild);
    }
  } else {
    if (navBtn) navBtn.style.display = 'inline-flex';
    if (navBtnM) navBtnM.style.display = 'inline-flex';
    if (avatar) avatar.style.display = 'none';
    if (sheetLogout) sheetLogout.style.display = 'none';
    const adminBtn = document.getElementById('sheetAdminBtn');
    if (adminBtn) adminBtn.remove();
  }
}

function toggleTheme() {
  State.theme = State.theme === 'dark' ? 'light' : 'dark';
  document.body.classList.toggle('dark-mode', State.theme === 'dark');
  try { localStorage.setItem('hunzai_theme', State.theme); } catch(e) {}
  document.querySelectorAll('.nav-icon-btn').forEach(btn => {
    if (btn.textContent.trim() === '🌙' || btn.textContent.trim() === '☀️') btn.textContent = State.theme === 'dark' ? '☀️' : '🌙';
  });
  if (document.getElementById('profileMenu').classList.contains('show')) openProfileMenu();
}

async function handleLogout() {
  if (!confirm('Yakin ingin logout?')) return;
  closeSheet(); closeProfileMenu();
  try { await fbLogout(); showToast('✓ Berhasil logout'); setTimeout(() => navigate('home'), 400); }
  catch (e) { showToast('⚠ ' + (mapFirebaseError(e.code) || e.message), 'error'); }
}

/* ============ ROUTER ============ */
async function render() {
  const app = document.getElementById('app');
  const page = State.currentPage;
  document.querySelectorAll('[data-nav]').forEach(el => el.classList.toggle('active', el.dataset.nav === page));
  document.querySelectorAll('[data-bnav]').forEach(el => el.classList.toggle('active', el.dataset.bnav === page));
  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.style.display = (State.history.length > 0 && window.innerWidth < 992) ? 'block' : 'none';

  // Intercept: kalau regEmail ada & page register → tampilkan verifikasi
  if (State.regEmail && PENDING_REGISTRATIONS.has(State.regEmail) && (page === 'register' || page === 'login')) {
    renderRegisterVerify();
    updateAuthUI();
    return;
  }

  try {
    switch (page) {
      case 'home': app.innerHTML = await renderHome(); break;
      case 'login': app.innerHTML = renderLogin('login'); break;
      case 'register': app.innerHTML = renderLogin('register'); break;
      case 'dashboard': app.innerHTML = await renderDashboard(); break;
      case 'bots': app.innerHTML = await renderBots(); break;
      case 'terminal': app.innerHTML = renderTerminal(); break;
      case 'profile': app.innerHTML = await renderProfile(); break;
      case 'settings': app.innerHTML = await renderSettings(); break;
      case 'feedback': app.innerHTML = renderFeedback(); break;
      case 'admin': app.innerHTML = renderAdminPanel(); break;
      default: app.innerHTML = await renderHome();
    }
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="page-wrap"><div class="card" style="max-width:480px;margin:3rem auto;text-align:center;padding:2rem;"><div style="font-size:2rem;margin-bottom:.75rem;">⚠️</div><div style="font-weight:800;margin-bottom:.4rem;">Terjadi kesalahan</div><div style="color:var(--muted);font-size:.85rem;">${err.message}</div></div></div>`;
  }
  if (page === 'terminal') initTerminal();
  updateAuthUI();
  document.querySelectorAll('.nav-icon-btn').forEach(btn => {
    if (btn.textContent.trim() === '🌙' || btn.textContent.trim() === '☀️') btn.textContent = State.theme === 'dark' ? '☀️' : '🌙';
  });
  if (page === 'home') setTimeout(loadHomeStats, 100);
}

async function loadHomeStats() {
  try {
    const usersSnap = await getDocs(collection(db, 'users'));
    const elU = document.getElementById('statUsers');
    if (elU) elU.textContent = usersSnap.size;
    let totalBots = 0;
    const limitSnap = await getDocs(query(collection(db, 'users'), limit(50)));
    for (const u of limitSnap.docs) {
      const botsSnap = await getDocs(collection(db, 'users', u.id, 'bots'));
      totalBots += botsSnap.size;
    }
    const elB = document.getElementById('statBots');
    if (elB) elB.textContent = totalBots;
  } catch(e) { console.warn('Stats error', e); }
}

function selectPlan(plan) {
  if (plan === 'Free') { navigate(State.user ? 'dashboard' : 'register'); return; }
  showModal(`<div class="modal-head"><h3>Pilih Paket ${plan}</h3><button class="modal-close" onclick="closeModal()">×</button></div><p style="color:var(--muted);font-size:.88rem;margin-bottom:1.25rem;">Untuk melanjutkan ke paket ${plan}, silakan ${State.user ? 'buka dashboard untuk upgrade' : 'daftar akun terlebih dahulu'}.</p><div style="display:flex;gap:.5rem;"><button class="btn-primary" style="flex:1;justify-content:center;" onclick="closeModal();navigate('${State.user ? 'dashboard' : 'register'}')">${State.user ? 'Buka Dashboard' : 'Daftar'}</button><button class="btn-outline" style="flex:1;justify-content:center;" onclick="closeModal()">Batal</button></div>`);
}

async function handleAuthSubmit(e, mode) {
  e.preventDefault();
  const btn = document.getElementById('authSubmitBtn');
  const email = document.getElementById('authEmail').value.trim().toLowerCase();
  const password = document.getElementById('authPassword').value;
  const name = document.getElementById('authName')?.value.trim() || '';
  const orig = btn.textContent;
  btn.textContent = 'Memproses...'; btn.disabled = true;

  try {
    if (mode === 'register') {
      btn.textContent = 'Mengirim kode...';
      await startRegistration(email, password, name);
      showToast('✓ Kode verifikasi dikirim ke email Anda');
      render(); // tampilkan halaman verifikasi
    } else {
      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) await fbLoginOrCreateAdmin(email, password);
      else await fbLogin(email, password);
      showToast('✓ Login berhasil!');
      setTimeout(() => navigate('dashboard'), 500);
    }
  } catch (err) {
    const msg = err.text || mapFirebaseError(err.code) || err.message || 'Terjadi kesalahan';
    showToast('⚠ ' + msg, 'error');
    btn.textContent = orig; btn.disabled = false;
  }
}
async function handleGoogleLogin() {
  try { await fbLoginGoogle(); showToast('✓ Login dengan Google berhasil'); setTimeout(() => navigate('dashboard'), 500); }
  catch (err) { showToast('⚠ ' + (mapFirebaseError(err.code) || err.message), 'error'); }
}

    w.data.botPhone = bp;

}

      <div class="term-body" id="termBody">
        <div class="term-line"><span class="t-succ">HunzAi Terminal v2.4.1</span></div>
        <div class="term-line"><span class="t-out">Selamat datang, ${State.user.name}!</span></div>
        <div class="term-line"><span class="t-out">Ketik </span><span class="t-cmd">help</span><span class="t-out"> untuk daftar perintah.</span></div>
        <div class="term-line">&nbsp;</div>
      </div>
      <div class="term-input"><span class="t-prompt">$</span><input type="text" id="termInput" placeholder="Ketik perintah..." autocomplete="off"></div>
    </div>
  </div>`;
}
function initTerminal() {
  const input = document.getElementById('termInput'); if (!input) return;
  input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { const cmd = input.value.trim(); if (!cmd) return; input.value = ''; runCommand(cmd); } });
}
async function runCommand(cmd) {
  const body = document.getElementById('termBody'); if (!body) return;
  const c = cmd.toLowerCase().trim();
  const echo = document.createElement('div'); echo.className = 'term-line';
  echo.innerHTML = `<span class="t-prompt">$</span> <span class="t-cmd">${escHtml(cmd)}</span>`; body.appendChild(echo);
  const out = document.createElement('div'); out.className = 'term-line';
  if (c === 'help') out.innerHTML = `<span class="t-out">Perintah:</span><br><span class="t-succ">  help</span><span class="t-out">      Daftar perintah</span><br><span class="t-succ">  whoami</span><span class="t-out">    Info akun</span><br><span class="t-succ">  bots</span><span class="t-out">      Daftar bot</span><br><span class="t-succ">  activity</span><span class="t-out">  Aktivitas terbaru</span><br><span class="t-succ">  apikey</span><span class="t-out">    API key</span><br><span class="t-succ">  clear</span><span class="t-out">     Bersihkan</span>`;
  else if (c === 'whoami') out.innerHTML = `<span class="t-out">  Nama     : ${State.user.name}</span><br><span class="t-out">  Email    : ${State.user.email}</span><br><span class="t-out">  User ID  : ${State.user.userId}</span><br><span class="t-out">  Role     : ${State.user.role}</span>`;
  else if (c === 'bots') { const bots = await fbGetBots(State.user.uid); out.innerHTML = bots.length === 0 ? '<span class="t-out">Belum ada bot.</span>' : bots.map(b => `<span class="t-succ">  ${b.name}</span><span class="t-out">  · ${b.botPhone}  · ${b.status}</span>`).join('<br>'); }
  else if (c === 'activity') { const acts = await fbGetActivities(State.user.uid, 5); out.innerHTML = acts.length === 0 ? '<span class="t-out">Belum ada.</span>' : acts.map(a => `<span class="t-out">  ${a.icon} ${a.title} · ${formatTimeAgo(a.timestamp)}</span>`).join('<br>'); }
  else if (c === 'apikey') out.innerHTML = `<span class="t-succ">${State.user.apiKey}</span>`;
  else if (c === 'clear') { body.innerHTML = ''; return; }
  else if (c === '') return;
  else out.innerHTML = `<span class="t-err">Perintah tidak dikenal: ${escHtml(cmd)}. Ketik 'help'.</span>`;
  body.appendChild(out); body.appendChild(document.createElement('div')).innerHTML = '&nbsp;';
  body.scrollTop = body.scrollHeight;
}

function toggleApiVisibility() {
  const f = document.getElementById('apiKeyField'), b = document.getElementById('apiKeyToggleBtn');
  if (!f) return;
  if (f.type === 'password') { f.type = 'text'; b.textContent = '🙈'; }
  else { f.type = 'password'; b.textContent = '👁️'; }
}
function openEditProfile() {
  const u = State.user;
  showModal(`<div class="modal-head"><h3>Edit Profil</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="form-group"><label>Nama Lengkap</label><input type="text" class="form-input" id="editName" value="${u.name}"></div><div class="form-group"><label>Handle</label><input type="text" class="form-input" id="editHandle" value="${u.handle}"></div><div class="form-group"><label>Bio</label><textarea class="form-input" id="editBio" rows="3" style="resize:vertical;font-family:inherit;">${u.bio || ''}</textarea></div><div style="display:flex;gap:.5rem;"><button class="btn-primary" style="flex:1;justify-content:center;" onclick="saveProfile()">💾 Simpan</button><button class="btn-outline" style="flex:1;justify-content:center;" onclick="closeModal()">Batal</button></div>`);
}
async function saveProfile() {
  const name = document.getElementById('editName').value.trim();
  const handle = document.getElementById('editHandle').value.trim();
  const bio = document.getElementById('editBio').value.trim();
  if (!name || !handle) { showToast('⚠ Nama & handle wajib', 'error'); return; }
  try {
    await fbUpdateUser(State.user.uid, { name, handle: handle.startsWith('@')?handle:'@'+handle, bio: bio || 'Belum menambahkan bio.', avatar: name.charAt(0).toUpperCase() });
    await fbLogActivity(State.user.uid, 'Profil diupdate', 'Profil diperbarui', '✏️');
    State.user = await fbGetUser(State.user.uid);
    closeModal(); showToast('✓ Profil disimpan'); updateAuthUI(); render();
  } catch (e) { showToast('⚠ ' + e.message, 'error'); }
}
function handleAvatarUpload(input) {
  const file = input.files && input.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('⚠ Harus gambar', 'error'); return; }
  if (file.size > 2 * 1024 * 1024) { showToast('⚠ Max 2MB', 'error'); return; }
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      await fbUpdateUser(State.user.uid, { avatarImage: e.target.result });
      await fbLogActivity(State.user.uid, 'Avatar diupdate', 'Foto profil diperbarui', '🖼️');
      State.user = await fbGetUser(State.user.uid);
      showToast('✓ Avatar diupload'); updateAuthUI(); render();
    } catch (err) { showToast('⚠ ' + err.message, 'error'); }
  };
  reader.readAsDataURL(file);
}
async function removeAvatar() {
  try { await fbUpdateUser(State.user.uid, { avatarImage: null }); State.user = await fbGetUser(State.user.uid); showToast('✓ Avatar dihapus'); updateAuthUI(); render(); }
  catch (e) { showToast('⚠ ' + e.message, 'error'); }
}
function confirmDeleteAccount() {
  showModal(`<div class="modal-head"><h3 style="color:var(--danger);">⚠️ Hapus Akun</h3><button class="modal-close" onclick="closeModal()">×</button></div><p style="color:var(--muted);font-size:.9rem;margin-bottom:1.25rem;">Akun <strong>${State.user.email}</strong> akan dihapus permanen.</p><div style="display:flex;gap:.5rem;"><button class="btn-outline" style="flex:1;justify-content:center;" onclick="closeModal()">Batal</button><button class="btn-primary" style="flex:1;justify-content:center;background:var(--danger);color:#fff;" onclick="deleteAccount()">Ya, Hapus</button></div>`);
}
async function deleteAccount() {
  try {
    const uid = State.user.uid;
    const bots = await fbGetBots(uid);
    for (const b of bots) await deleteDoc(doc(db,'users',uid,'bots',b.id));
    const acts = await fbGetActivities(uid, 999);
    for (const a of acts) await deleteDoc(doc(db,'users',uid,'activities',a.id));
    await deleteDoc(doc(db,'users',uid,'settings','main')).catch(()=>{});
    await deleteDoc(doc(db,'users',uid,'settings','chatbot')).catch(()=>{});
    await deleteDoc(doc(db,'users',uid,'settings','webhook')).catch(()=>{});
    await deleteDoc(doc(db,'users',uid));
    if (auth.currentUser) await auth.currentUser.delete();
    closeModal();
    showToast('✓ Akun dihapus');
    setTimeout(() => navigate('home'), 600);
  } catch (e) { showToast('⚠ ' + (e.code === 'auth/requires-recent-login' ? 'Login ulang untuk hapus akun' : e.message), 'error'); }
}

(async function boot() {
  try { const t = localStorage.getItem('hunzai_theme'); if (t === 'dark') { State.theme = 'dark'; document.body.classList.add('dark-mode'); } } catch(e) {}

  onAuthStateChanged(auth, async (firebaseUser) => {
    if (firebaseUser) {
      State.firebaseUser = firebaseUser;
      let userData = await fbGetUser(firebaseUser.uid);
      if (!userData) {
        const isAdminEmail = firebaseUser.email.toLowerCase() === ADMIN_EMAIL;
        await fbCreateUserDoc(firebaseUser.uid, {
          email: firebaseUser.email.toLowerCase(),
          name: firebaseUser.displayName || firebaseUser.email.split('@')[0],
          handle: '@' + firebaseUser.email.split('@')[0].toLowerCase(),
          avatar: (firebaseUser.displayName || firebaseUser.email[0]).charAt(0).toUpperCase(),
          avatarImage: firebaseUser.photoURL || null,
          provider: 'G Akun Google',
          role: isAdminEmail ? 'Administrator' : 'User',
          badge: isAdminEmail ? '👑 ADMIN' : '💎 FREE',
          plan: isAdminEmail ? 'Infinity' : 'Free',
          googleLinked: true, verified: true
        });
        userData = await fbGetUser(firebaseUser.uid);
      }
      State.user = userData;
      try { await fbUpdateUser(firebaseUser.uid, { isOnline: true, lastLogin: serverTimestamp() }); } catch(e) {}
    } else {
      State.user = null; State.firebaseUser = null;
    }
    updateAuthUI();

    await loadSiteContent();
    if (SITE.branding) {
      document.title = SITE.branding.metaTitle || document.title;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', SITE.branding.metaDescription || '');
    }

    document.getElementById('bootScreen').style.display = 'none';
    document.getElementById('topNav').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';

    const hash = window.location.hash.replace('#','') || 'home';
    const validPages = ['home','login','register','dashboard','bots','terminal','profile','settings','feedback','admin'];
    State.currentPage = validPages.includes(hash) ? hash : 'home';

    await render();
    if (State.user) setTimeout(() => showToast(`✓ Selamat datang, ${State.user.name}!`), 500);
  });

  window.addEventListener('hashchange', () => {
    const h = window.location.hash.replace('#','') || 'home';
    const validPages = ['home','login','register','dashboard','bots','terminal','profile','settings','feedback','admin'];
    if (validPages.includes(h) && h !== State.currentPage) { State.currentPage = h; render(); }
  });
  window.addEventListener('resize', () => {
    const backBtn = document.getElementById('backBtn');
    if (backBtn) backBtn.style.display = (State.history.length > 0 && window.innerWidth < 992) ? 'block' : 'none';
  });
})();
</script>
</body>
</html>
